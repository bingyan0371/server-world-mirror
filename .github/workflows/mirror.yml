name: Mirror server-world.info en
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Install wget
        run: sudo apt update && sudo apt install -y wget

      - name: Mirror website
        run: |
          mkdir -p public
          cd public
          wget --mirror \
               --convert-links \
               --adjust-extension \
               --page-requisites \
               --no-parent \
               --wait=2 \
               --random-wait \
               --exclude-directories=/cgi-bin,/tmp,/ja \
               --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
               --header="Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
               --header="Referer: https://server-world.info/en" \
               https://server-world.info/en
          mv server-world.info/en/* ./ || true
          rm -rf server-world.info

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
